plugins {
    id 'com.github.johnrengelman.shadow'
    id 'com.diffplug.spotless' version "7.0.0.BETA3"
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        url "https://cursemaven.com"
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
    implementation "mod.azure.azurelib:azurelib-neo-${minecraft_version}:${azurelib_version}"
    implementation "curse.maven:worldedit-225608:5830452"
    modApi "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

spotless {
    java {
        eclipse().configFile("$rootDir/eclipse-formatter.xml")
        endWithNewline()
        importOrder("", "java", group.toString(), "\\#")
        indentWithSpaces(4)
        removeUnusedImports()
        trimTrailingWhitespace()
    }
}

tasks.build {
    dependsOn("spotlessApply")
}

// CurseForge upload. Dry run by default; pass -Ppublish to actually upload.
//   ./gradlew :neoforge:publishMods -Ppublish
// The token is read from ~/.gradle/gradle.properties (curseforge_token), never from this repo.
publishMods {
    file = remapJar.archiveFile
    changelog = rootProject.file("CHANGELOG.md").text.split(/(?m)^## /)[1].with { "## " + it.trim() }
    type = STABLE
    displayName = "Hyrule Terrors ${project.version} (NeoForge)"
    modLoaders.add("neoforge")
    dryRun = !providers.gradleProperty("publish").isPresent()

    curseforge {
        accessToken = providers.gradleProperty("curseforge_token")
        projectId = rootProject.curseforge_project_id
        minecraftVersions.add(rootProject.minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        // Needed on both sides (CurseForge requires an environment tag).
        clientRequired = true
        serverRequired = true
        requires("architectury-api", "azurelib", "cloth-config")
    }
}
