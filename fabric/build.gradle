plugins {
    id 'com.github.johnrengelman.shadow'
    id 'com.diffplug.spotless' version "7.0.0.BETA3"
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}
repositories {
    maven { url 'https://maven.terraformersmc.com/releases' }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    modImplementation "mod.azure.azurelib:azurelib-fabric-${minecraft_version}:${azurelib_version}"
    modApi "com.terraformersmc:modmenu:${modmenu_version}"
    modApi("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

spotless {
    java {
        eclipse().configFile("$rootDir/eclipse-formatter.xml")
        endWithNewline()
        importOrder("", "java", group.toString(), "\\#")
        indentWithSpaces(4)
        removeUnusedImports()
        trimTrailingWhitespace()
    }
}

tasks.build {
    dependsOn("spotlessApply")
}

// CurseForge upload. Dry run by default; pass -Ppublish to actually upload.
//   ./gradlew :fabric:publishMods -Ppublish
// The token is read from ~/.gradle/gradle.properties (curseforge_token), never from this repo.
publishMods {
    file = remapJar.archiveFile
    changelog = rootProject.file("CHANGELOG.md").text.split(/(?m)^## /)[1].with { "## " + it.trim() }
    type = STABLE
    displayName = "Hyrule Terrors ${project.version} (Fabric)"
    modLoaders.add("fabric")
    dryRun = !providers.gradleProperty("publish").isPresent()

    curseforge {
        accessToken = providers.gradleProperty("curseforge_token")
        projectId = rootProject.curseforge_project_id
        minecraftVersions.add(rootProject.minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)
        requires("architectury-api", "azurelib", "cloth-config", "fabric-api")
        optional("modmenu")
    }
}
