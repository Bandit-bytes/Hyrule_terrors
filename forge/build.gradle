plugins {
    id 'com.github.johnrengelman.shadow'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

loom {
    forge {
        mixinConfig "hyrule_terrors.mixins.json"
    }
    runs {
        client {
            property "mixin.env.remapRefMap", "true"
            property "mixin.env.refMapRemappingFile", "${projectDir}/build/createSrgToMcp/output.srg"
        }
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}
repositories {
    maven {
        name = "AzureDoom Mods"
        url = "https://maven.azuredoom.com/mods"
    }
    maven { url = "https://repo.spongepowered.org/maven" }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"

    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"
    modApi "me.shedaniel.cloth:cloth-config-forge:${rootProject.cloth_config_version}"
    modImplementation "mod.azure.azurelib:azurelib-neo-${minecraft_version}:${azurelib_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    implementation(include("io.github.llamalad7:mixinextras-forge:0.5.0"))
    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

// CurseForge + Modrinth upload. Dry run by default; pass -Ppublish to actually upload.
//   ./gradlew :forge:publishMods -Ppublish
// The tokens are read from ~/.gradle/gradle.properties (curseforge_token, modrinth_token), never from this repo.
// Upload to one site only with publishCurseforge or publishModrinth instead of publishMods.
publishMods {
    file = remapJar.archiveFile
    changelog = rootProject.file("CHANGELOG.md").text.split(/(?m)^## /)[1].with { "## " + it.trim() }
    type = STABLE
    displayName = "Hyrule Terrors ${project.version} (Forge)"
    modLoaders.add("forge")
    dryRun = !providers.gradleProperty("publish").isPresent()

    curseforge {
        accessToken = providers.gradleProperty("curseforge_token")
        projectId = rootProject.curseforge_project_id
        minecraftVersions.add(rootProject.minecraft_version.trim())
        javaVersions.add(JavaVersion.VERSION_17)
        // Needed on both sides (CurseForge requires an environment tag).
        clientRequired = true
        serverRequired = true
        requires("architectury-api", "azurelib", "cloth-config")
    }

    modrinth {
        accessToken = providers.gradleProperty("modrinth_token")
        projectId = rootProject.modrinth_project_id
        minecraftVersions.add(rootProject.minecraft_version.trim())
        requires("architectury-api", "azurelib", "cloth-config")
    }
}
